# Run-time constants shared by every runner: Python loads it directly, Julia through protocol.jl, C++ through the header protocol.py generates. Sweeps, tolerances, pins and the optimize policy are spelled out in the set files under sets/.

# Rows are [first-run seconds below, floor, ceiling]; a run stops past its floor once median/min - 1 is within spread.
[repeats]
cap = 20
schedule = [[0.1, 20, 20], [3.0, 10, 10], [5.0, 5, 10], [inf, 3, 10]]
spread = 0.02

[watchdog]
seconds = 120
exit_code = 3
# Hard-exit budget of a line's optimize; its solves then run at the solver's own geometry.
optimize_seconds = 600

# A cubie optimize runs `waves` occupancy waves of the kernel (per kernel) or the line's n (per solve), timed at the duration whose launch takes about launch_ms.
[optimize]
launch_ms = 20
waves = 5
