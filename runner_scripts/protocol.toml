# Benchmark protocol shared by every writer: Python loads it directly, Julia through protocol.jl, C++ through the header protocol.py generates.

[ensemble]
n_wp = 131072
n_ne = 1024
n_states = 131072
n_min = 8
n_step = 4
nmax_default = 16777216
states_grid = [4, 8, 16, 32, 64, 128]
# The ne ensemble is the first n_ne points of the n_wp sweep, except for these problems, which keep golden_ne_<problem>_<n_ne>.csv as their grid.
ne_legacy_grid = ["ring_modulator_index2", "nand_gate"]

# Fixed steps are duration * 2^-k.
[fixed]
timing_k = 10
wp_k = [4, 13]
euler_k = [8, 17]
ne_k = [1, 13]

# Tolerances are atol = rtol; the sweep grid is 10^-k. Adaptive solves start at the timing step and floor at duration * dt_min_fraction.
[adaptive]
timing_tol = 1.0e-5
overlap_tol = 1.0e-8
tol_k = [2, 8]
dt_min_fraction = 1.0e-6

# Fixed-step implicit stages: the Newton iteration stops when eta * ||dz|| < kappa, with ||dz|| the rms of dz_i / (atol + rtol * |u_i|),
# eta = theta / (1 - theta) the contraction estimate, and kappa each library's default 0.01 (OrdinaryDiffEq NLNewton, diffrax VeryChord,
# cubie's hard-coded acceptance bound). atol and rtol below are the abstol/reltol OrdinaryDiffEq takes with adaptive = false, diffrax's
# VeryChord(rtol, atol, norm = rms_norm) and cubie's newton_atol/newton_rtol; they sit under the Float32 roundoff floor of the fixed-step
# sweeps so the stage solve never limits a curve. Adaptive solves scale the Newton norm by the step tolerance instead (OrdinaryDiffEq
# and diffrax by construction; cubie is told newton_atol = newton_rtol = tol, its own default being the controller tolerance / 10, and it
# warns that the two are equal and floors newton_rtol at 4 eps(Float32) = 4.8e-7). Left to each library: the iteration cap (OrdinaryDiffEq
# 10, diffrax 10, cubie 8) and the linear solve inside each Newton step (dense LU in OrdinaryDiffEq and diffrax; cubie's per-family
# default, LU for dirk and firk, a five-step minimal-residual Krylov solve at the step tolerance for backwards_euler). DiffEqGPU's kernels
# take none of this: their Newton stops at an unscaled residual rms below 100 eps(Float32) within 30 iterations.
[newton]
atol = 1.0e-6
rtol = 1.0e-6

# Solver.optimize runs on an n-trajectory batch; families listed are optimised at every setting, the rest once per leg.
[optimize]
n = 262144
per_point_families = ["dirk", "firk", "rosenbrock", "implicit"]

# Rows are [first-run seconds below, floor, ceiling]; a leg stops past its floor once median/min - 1 is within spread.
[repeats]
cap = 20
schedule = [[0.1, 20, 20], [3.0, 10, 10], [5.0, 5, 10], [inf, 3, 10]]
spread = 0.02

[watchdog]
seconds = 120
exit_code = 3

[plots]
max_errored_pct = 10.0
