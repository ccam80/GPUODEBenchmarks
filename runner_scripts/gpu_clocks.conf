# Sustainable clock targets per GPU, used by runner_scripts/clocks.py.
#
#   <gpu-slug>  <sm_mhz>  <mem_mhz>
#
# The slug is the GPU half of the dataset key (RTX-2060-SUPER).
# python3 runner_scripts/calibrate/calibrate_clocks.py writes a card's row.
# A run needs a row here, --lock-clocks SM[,MEM], or --no-lock-clocks.
# Target the P2 rates on GeForce parts; -lgc above them times an overclock.

# Measured 2026-07-30, driver 595.84: flat 1470/6801 plateau, no throttling.
# This card refuses -lmc, so 6801 is informational only.
RTX-2060-SUPER 1470 6801
