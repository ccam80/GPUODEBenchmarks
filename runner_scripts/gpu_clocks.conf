# Sustainable clock targets per GPU, used by runner_scripts/clocks.py.
#
#   <gpu-slug>  <sm_mhz>  <mem_mhz>
#
# The slug is the GPU half of the dataset key bench_key.py emits
# (e.g. RTX-2060-SUPER). To add a machine, run the calibration; it writes
# the row (and the comment above it) itself, replacing an earlier row:
#
#   python3 runner_scripts/calibrate/calibrate_clocks.py
#
# A run without a row here refuses to start unless it is told to run
# unlocked (--no-lock-clocks) or given a target (--lock-clocks SM[,MEM]).
# On GeForce parts a compute context caps both clocks at the P2 rates; target
# those, since -lgc above them times an overclock rather than normal CUDA.

# Measured 2026-07-30, driver 595.84: flat 1470/6801 plateau, no throttling.
# This card refuses -lmc, so 6801 is informational only.
RTX-2060-SUPER 1470 6801
