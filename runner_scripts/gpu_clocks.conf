# Sustainable clock targets per GPU, used by runner_scripts/clock_guard.sh.
#
#   <gpu-slug>  <sm_mhz>  <mem_mhz>
#
# The slug is the GPU half of the dataset key bench_key.sh emits
# (e.g. RTX-2060-SUPER). To add a machine, run the calibration and paste
# the row it prints:
#
#   python3 runner_scripts/calibrate/calibrate_clocks.py
#
# On GeForce parts a compute context caps both clocks at the P2 rates; target
# those, since -lgc above them times an overclock rather than normal CUDA.

# Measured 2026-07-30, driver 595.84: flat 1470/6801 plateau, no throttling.
# This card refuses -lmc, so 6801 is informational only.
RTX-2060-SUPER 1470 6801
