# Sustainable clock targets per GPU, used by runner_scripts/clock_guard.sh.
#
#   <gpu-slug>  <sm_mhz>  <mem_mhz>
#
# The slug is the GPU half of the dataset key bench_key.sh emits, so it matches
# the names already used in data/ and plots/ (e.g. RTX-2060-SUPER).
#
# To add a machine, run the calibration and paste the row it prints:
#
#   python3 runner_scripts/calibrate/calibrate_clocks.py
#
# Then lock the clocks:
#
#   sudo nvidia-smi -pm 1
#   sudo nvidia-smi -lgc <sm>,<sm>
#   sudo nvidia-smi -lmc <mem>,<mem>
#
# There is no field reporting whether a lock took: an idle GPU still reading the
# target clock is the check. run_full_dataset.sh checks per stage that it held.
#
# On GeForce parts a compute context drops the card into P2, capping both clocks
# below their graphics maxima. Target the P2 clocks: -lgc can be pushed above
# them, but then the timings describe an overclock rather than normal CUDA.

# Measured 2026-07-30, driver 595.84: 1470/6801 on all 587 plateau samples,
# nothing throttled, and unchanged under a light load on a cold card -- the P2
# ceiling rather than a thermal limit. This card refuses -lmc, so 6801 is the
# clock the driver selects, not one that can be pinned.
RTX-2060-SUPER 1470 6801
