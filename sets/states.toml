# Runtime against the state count: lorenz96 resized, built cold so the build time is measured, timed at one ensemble size.

[set]
packages   = ["cubie", "cubie_mlir", "jax", "pytorch", "myokit_cuda", "cpp", "julia_gpu", "julia_cpu"]
problems   = ["lorenz96"]
algorithms = "all"
precision  = "float32"
finals     = false
transfers  = ["both", "none"]
build      = "cold"

[[grid]]
packages = "all"
parameter = "default"
scale = "default"
min = "default"
max = "default"
n = [131072]
system_params = {states = [4, 8, 16, 32, 64, 128]}

[[stepping]]
packages = "all"
algorithms = "all"
controller = "fixed"
dt = {duration_times_2_pow = [-10]}
newton = {atol = 1.0e-6, rtol = 1.0e-6}

[[stepping]]
packages = "all"
algorithms = "all"
controller = "default"
tol = [1.0e-5]
dt0 = {duration_times_2_pow = -10}
dt_min = {duration_times = 1.0e-6}
dt_max = "none"
newton = "tol"
gains = {}

[[stepping]]
packages = ["cubie", "cubie_mlir"]
algorithms = "all"
controller = "pi"
tol = [1.0e-5]
dt0 = {duration_times_2_pow = -10}
dt_min = {duration_times = 1.0e-6}
dt_max = "none"
newton = "tol"
gains = "dirk_defaults"
