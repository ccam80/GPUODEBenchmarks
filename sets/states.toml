# Runtime and cold build time against the state count: lorenz96 resized, built in a fresh cache so the build time is measured, timed at one ensemble size under each package's default adaptive controller.

[set]
packages   = ["cubie", "cubie_mlir", "jax", "pytorch", "myokit_cuda", "cpp", "julia_gpu"]
problems   = ["lorenz96"]
algorithms = "all"
precision  = "float32"
finals     = false
transfers  = ["both", "none"]
build      = "cold"

[set.optimize]
packages = ["cubie", "cubie_mlir"]

[[grid]]
packages = "all"
parameter = "default"
scale = "default"
min = "default"
max = "default"
n = [131072]
system_params = {states = [4, 8, 16, 32, 64, 128]}

[[stepping]]
packages = "all"
algorithms = ["tsit5", "cash-karp-54", "rosenbrock23_sciml", "kvaerno3", "vern7", "kvaerno5"]
controller = "default"
tol = [1.0e-5]
dt0 = {duration_times_2_pow = -10}
dt_min = "none"
dt_max = "none"
newton = "tol"
gains = {}
