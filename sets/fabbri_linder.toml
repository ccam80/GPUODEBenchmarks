# The Fabbri-Linder work-precision dataset: cubie_mlir and myokit_cuda over the 131072-point ACh x Iso grid, timed on the resident inputs, Euler at five fixed steps and every other cubie algorithm at tolerances 1e-2 to 1e-8, each run tracing the first 1024 points (the 32 x 32 lattice) at the protocol's 1 ms samples over the first second; the golden is the golden set's 1024-point julia_cpu run.

[set]
packages   = ["cubie_mlir", "myokit_cuda"]
problems   = ["fabbri_linder"]
algorithms = "all"
precision  = "float32"
finals     = false
traces     = ["fabbri_linder"]
transfers  = ["none"]
build      = "warm"
watchdog   = 1800

[set.optimize]
packages = ["cubie_mlir"]

[[grid]]
packages = "all"
parameter = "default"
scale = "default"
min = "default"
max = "default"
n = [131072]
system_params = {}

# Euler at 100 us, 20 us, 5 us, 1 us and 250 ns: every step divides the 1 ms sample interval.
[[stepping]]
packages = "all"
algorithms = ["euler"]
controller = "fixed"
dt = [1.0e-4, 2.0e-5, 5.0e-6, 1.0e-6, 2.5e-7]
newton = "none"

# Every adaptive algorithm at 1e-2 to 1e-8, starting from a 100 us step.
[[stepping]]
packages = "all"
algorithms = "all"
controller = "default"
tol = [1.0e-2, 1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7, 1.0e-8]
dt0 = 1.0e-4
dt_min = "none"
dt_max = "none"
newton = "tol"
gains = {}
