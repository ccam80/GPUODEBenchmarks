# The float64 half of the precision comparison as a timing sweep over trajectory counts: cubie and modax at Tsit5 and Rodas5P, with modax's Rodas5P factorising its LU in float32 (rodas5p) and in float64 (rodas5p_lu64), at tolerance 1e-5 on perf's grid. The perf set holds cubie's float32 runs of the same points.

[set]
packages   = ["cubie", "modax"]
problems   = ["lorenz", "lorenz96", "pleiades", "pollu"]
algorithms = ["tsit5", "rodas5p", "rodas5p_lu64"]
precision  = "float64"
finals     = false
transfers  = ["both", "none"]
build      = "warm"

[set.optimize]
packages = ["cubie"]

[[grid]]
packages = "all"
parameter = "default"
scale = "default"
min = "default"
max = "default"
n = [8, 32, 128, 512, 2048, 8192, 32768, 131072, 524288, 2097152, 8388608, 16777216]
system_params = {}

[[stepping]]
packages = "all"
algorithms = "all"
controller = "default"
tol = [1.0e-5]
dt0 = {duration_times_2_pow = -10}
dt_min = "none"
dt_max = "none"
newton = "tol"
gains = {}
