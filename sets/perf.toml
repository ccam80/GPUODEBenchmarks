# Timing sweep over trajectory counts: every GPU package, every problem it implements, the algorithms at least two package families run, at one fixed step and one tolerance.

[set]
packages   = ["cubie", "cubie_mlir", "jax", "pytorch", "myokit_cuda", "cpp", "julia_gpu"]
problems   = "all"
algorithms = "all"
precision  = "float32"
finals     = false
transfers  = ["both", "none"]
build      = "warm"

[set.optimize]
packages = ["cubie", "cubie_mlir"]
per = "solve"

[[grid]]
packages = "all"
parameter = "default"
scale = "default"
min = "default"
max = "default"
n = [8, 32, 128, 512, 2048, 8192, 32768, 131072, 524288, 2097152, 8388608, 16777216]
system_params = {}

[[stepping]]
packages = "all"
algorithms = ["euler", "classical-rk4", "tsit5", "rosenbrock23_sciml", "kvaerno3", "vern7", "kvaerno5"]
controller = "fixed"
dt = {duration_times_2_pow = [-10]}
newton = {atol = 1.0e-6, rtol = 1.0e-6}

[[stepping]]
packages = "all"
algorithms = ["tsit5", "cash-karp-54", "rosenbrock23_sciml", "kvaerno3", "vern7", "kvaerno5"]
controller = "default"
tol = [1.0e-5]
dt0 = {duration_times_2_pow = -10}
dt_min = "none"
dt_max = "none"
newton = "tol"
gains = {}

[[stepping]]
packages = ["cubie", "cubie_mlir"]
algorithms = ["tsit5", "cash-karp-54", "rosenbrock23_sciml", "kvaerno3", "vern7", "kvaerno5"]
controller = "pi"
tol = [1.0e-5]
dt0 = {duration_times_2_pow = -10}
dt_min = "none"
dt_max = "none"
newton = "tol"
gains = "dirk_defaults"
