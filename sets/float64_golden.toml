# The float64 half of the precision comparison as finals on golden_grid's 131072-point grid: cubie and modax at Tsit5 and Rodas5P, with modax's Rodas5P factorising its LU in float32 (rodas5p) and in float64 (rodas5p_lu64), at tolerances 1e-2 to 1e-8. The golden_grid set holds cubie's float32 runs of the same points.

[set]
packages   = ["cubie", "modax"]
problems   = ["lorenz", "lorenz96", "pleiades", "pollu"]
algorithms = ["tsit5", "rodas5p", "rodas5p_lu64"]
precision  = "float64"
finals     = true
transfers  = ["none"]
build      = "warm"

[set.optimize]
packages = ["cubie"]

[[grid]]
packages = "all"
parameter = "default"
scale = "default"
min = "default"
max = "default"
n = [131072]
system_params = {}

[grid.problems]
lorenz = {max = 0.16390353319956361}
lorenz96 = {max = 0.12487888243776274}
pleiades = {max = 0.51170739522854025}
pollu = {max = 0.036280887705686042}

[[stepping]]
packages = "all"
algorithms = "all"
controller = "default"
tol = [1.0e-2, 1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7, 1.0e-8]
dt0 = {duration_times_2_pow = -10}
dt_min = "none"
dt_max = "none"
newton = "tol"
gains = {}
