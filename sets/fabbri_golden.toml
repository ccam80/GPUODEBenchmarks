# The Fabbri-Linder float64 reference: julia_cpu runs the golden algorithm at its golden tolerance on the 1024-point head lattice (grid indices 0 to 1023, the first 1024 points of the 131072-point grid), finals and traces kept, every step-size pin left to the package, a day per solve, untimed.

[set]
packages   = ["julia_cpu"]
problems   = ["fabbri_linder"]
algorithms = "golden_algorithm"
precision  = "float64"
finals     = true
traces     = true
transfers  = ["none"]
build      = "warm"
watchdog   = 86400

[set.untimed]
packages = "all"

[[grid]]
packages = "all"
parameter = "default"
scale = "default"
min = "default"
max = 1023.0
n = [1024]
system_params = {}

[[stepping]]
packages = "all"
algorithms = "golden_algorithm"
controller = "default"
tol = "golden_tol"
dt0 = "none"
dt_min = "none"
dt_max = "none"
newton = "none"
gains = {}
